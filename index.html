<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice to Sign Language Animation System</title>

<style>
:root {
    --primary-color: #0056b3;
    --secondary-color: #28a745;
    --background-color: #eef2f7;
    --highlight-color: #ffc107;
    --listening-color: #dc3545;
}

body {
    font-family: Arial, sans-serif;
    background: var(--background-color);
    margin: 0;
}

header {
    background: var(--primary-color);
    color: white;
    padding: 20px;
    text-align: center;
}

.container {
    background: white;
    margin: 20px auto;
    padding: 30px;
    max-width: 1100px;
    border-radius: 10px;
}

textarea, select, button {
    padding: 10px;
    margin-top: 10px;
}

button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
}

#voice-input-btn.listening {
    background: var(--listening-color);
    color: white;
}

#fingerspell-output, #camera-sign-output {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 15px;
    justify-content: center;
}

img {
    width: 85px;
    height: 85px;
    border: 2px solid var(--primary-color);
    border-radius: 6px;
}

video {
    border: 2px solid #ccc;
    border-radius: 10px;
}
</style>
</head>

<body>

<header>
<h1>🗣️ Voice to Sign Language Image Animation System</h1>
</header>

<div class="container">

<h2>1. Text / Voice → Sign Language</h2>

<select id="language-select">
<option value="en-US">English</option>
<option value="ta-IN">Tamil</option>
<option value="hi-IN">Hindi</option>
</select>

<br>

<textarea id="text-input" rows="4" placeholder="Type text or speak..."></textarea>
<br>

<button id="voice-input-btn">🎤 Use Voice Input</button>
<button id="translate-btn">Translate</button>

<p><strong>Emotion:</strong> <span id="emotion-output">None</span></p>

<div id="fingerspell-output">
<p>Waiting for input...</p>
</div>

<hr>

<h2>2. Camera-Based Emotion & Sign Recognition (Prototype)</h2>

<video id="camera" width="320" height="240" autoplay muted></video>
<br><br>

<button id="start-camera-btn">📷 Start Camera</button>
<button id="scan-btn">🔍 Scan Frame</button>

<p><strong>Detected Emotion:</strong> <span id="camera-emotion">None</span></p>
<p><strong>Detected Text:</strong> <span id="camera-text">None</span></p>

<div id="camera-sign-output"></div>

</div>

<script>
document.addEventListener('DOMContentLoaded', () => {

const textInput = document.getElementById('text-input');
const translateBtn = document.getElementById('translate-btn');
const voiceInputBtn = document.getElementById('voice-input-btn');
const emotionOutput = document.getElementById('emotion-output');
const fingerspellOutput = document.getElementById('fingerspell-output');

/* -----------------------------
   IMAGE PATHS
------------------------------ */
const ASL_IMAGE_PATHS = {};
for (let i = 65; i <= 90; i++) {
    ASL_IMAGE_PATHS[String.fromCharCode(i)] = `images/${String.fromCharCode(i)}.png`;
}
for (let i = 0; i <= 9; i++) {
    ASL_IMAGE_PATHS[i] = `images/${i}.png`;
}
const getFallbackUrl = (c) =>
`https://placehold.co/85x85/0056b3/ffffff?text=${c}`;

/* -----------------------------
   SIGN DICTIONARY
------------------------------ */
const signDictionary = {
    happy: { emotion: "Happy 😄", keyword: "HAPPY" },
    sad: { emotion: "Sad 😢", keyword: "SAD" },
    angry: { emotion: "Angry 😠", keyword: "ANGRY" },
    hello: { emotion: "Neutral 👤", keyword: "HELLO" }
};

/* -----------------------------
   TEXT / VOICE → SIGN
------------------------------ */
function simulateFingerspelling(word) {
    fingerspellOutput.innerHTML = '';
    word.split('').forEach(letter => {
        const img = document.createElement('img');
        img.src = ASL_IMAGE_PATHS[letter] || getFallbackUrl(letter);
        img.onerror = () => img.src = getFallbackUrl(letter);
        fingerspellOutput.appendChild(img);
    });
}

function startTranslation() {
    const input = textInput.value.toLowerCase();
    if (!input) return;

    const found = signDictionary[input] || { emotion: "Neutral 👤", keyword: input.toUpperCase() };
    emotionOutput.textContent = found.emotion;
    simulateFingerspelling(found.keyword);
}

translateBtn.onclick = startTranslation;

/* -----------------------------
   VOICE INPUT
------------------------------ */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
    const recognition = new SpeechRecognition();
    recognition.onstart = () => voiceInputBtn.classList.add('listening');
    recognition.onend = () => voiceInputBtn.classList.remove('listening');
    recognition.onresult = e => {
        textInput.value = e.results[0][0].transcript;
        startTranslation();
    };
    voiceInputBtn.onclick = () => recognition.start();
}

/* ==================================================
   CAMERA → EMOTION / SIGN (SIMULATION)
================================================== */

const camera = document.getElementById('camera');
const startCameraBtn = document.getElementById('start-camera-btn');
const scanBtn = document.getElementById('scan-btn');
const cameraEmotion = document.getElementById('camera-emotion');
const cameraText = document.getElementById('camera-text');
const cameraSignOutput = document.getElementById('camera-sign-output');

let started = false;

startCameraBtn.onclick = async () => {
    if (started) return;
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    camera.srcObject = stream;
    started = true;
};

scanBtn.onclick = () => {
    cameraSignOutput.innerHTML = '';

    const emotions = ["Happy 😄", "Neutral 👤"];
    const signs = ["HELLO", "THANKYOU"];

    const detectedEmotion = emotions[Math.floor(Math.random()*emotions.length)];
    const detectedSign = signs[Math.floor(Math.random()*signs.length)];

    if (detectedEmotion.includes("Happy")) {
        cameraEmotion.textContent = detectedEmotion;
        cameraText.textContent = "-";

        const img = document.createElement('img');
        img.src = ASL_IMAGE_PATHS["H"];
        img.onerror = () => img.src = getFallbackUrl("H");
        cameraSignOutput.appendChild(img);
    } else {
        cameraEmotion.textContent = detectedEmotion;
        cameraText.textContent = detectedSign;

        detectedSign.split('').forEach(l => {
            const img = document.createElement('img');
            img.src = ASL_IMAGE_PATHS[l];
            img.onerror = () => img.src = getFallbackUrl(l);
            cameraSignOutput.appendChild(img);
        });
    }
};

});
</script>

</body>
</html>
