<h3>2. Camera-Based Sign & Emotion Recognition (Prototype)</h3>
<p>Detects facial emotion and hand signs from camera input.</p>

<div class="input-area">
    <video id="camera" width="320" height="240" autoplay muted style="border-radius:10px; border:2px solid #ccc;"></video>
    <br><br>
    <button id="start-camera-btn">📷 Start Camera</button>
    <button id="scan-btn">🔍 Scan Frame</button>
</div>

<div class="output-area">
    <p><strong>Detected Emotion:</strong> <span id="camera-emotion">None</span></p>
    <p><strong>Detected Sign / Text:</strong> <span id="camera-text">None</span></p>

    <div id="camera-sign-output" style="margin-top:15px;"></div>
</div>
